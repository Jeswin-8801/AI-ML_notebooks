[project]
name = "AI-ML_notebooks"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Jeswin Santosh", email = "jeswin.santosh@outlook.com"},
]
dependencies = [
    "notebook>=7.5.1",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "opencv-python>=4.13.0.92",
    "torchsummary>=1.5.1",
    "torchviz>=0.0.3",
    "openpyxl>=3.1.5",
    "yfinance>=1.3.0",
]
requires-python = "==3.14.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false
